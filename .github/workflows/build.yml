name: Build Omi VST3

on:
  push:
  workflow_dispatch:
    inputs:
      mac_runner:
        description: 'Mac de GitHub : macos-15 (Apple Silicon) ou macos-15-intel'
        default: 'macos-15'

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Upload VST3 (Windows)
        uses: actions/upload-artifact@v4
        with:
          name: Omi-VST3-Windows
          path: build/Omi_artefacts/Release/VST3/
          if-no-files-found: error

  macos:
    runs-on: ${{ inputs.mac_runner || 'macos-15' }}   # Mac Apple Silicon par defaut (binaire universel) ; mac-retry.yml relance sur macos-15-intel si aucune machine n'est prise
    steps:
      - uses: actions/checkout@v5
      - name: Configure (binaire universel Intel + Apple Silicon)
        run: cmake -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Signature locale (ad hoc) et archive
        run: |
          cd "build/Omi_artefacts/Release/VST3"
          xattr -cr "Omi.vst3"
          codesign --force --deep --sign - "Omi.vst3"
          codesign --verify --deep --strict "Omi.vst3"
          ditto -c -k --sequesterRsrc --keepParent "Omi.vst3" "$GITHUB_WORKSPACE/Omi-VST3-macOS.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Omi-VST3-macOS
          path: Omi-VST3-macOS.zip
          if-no-files-found: error

  # Publie la version (tag v<VERSION de CMakeLists>) en Release GitHub, fichiers a nom fixe :
  # les liens .../releases/latest/download/Omi-VST3-<OS>.zip du README suivent chaque version.
  # Version Windows publiee sans attendre le Mac (Mac de GitHub parfois satures) ;
  # release-mac ajoute ensuite l'archive macOS a la meme Release.
  release:
    if: github.ref == 'refs/heads/main'
    needs: [windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Version
        id: v
        run: echo "version=$(sed -n 's/^project([A-Za-z0-9_]* VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Archives
        run: |
          (cd dist/Omi-VST3-Windows && zip -r -q "$GITHUB_WORKSPACE/Omi-VST3-Windows.zip" Omi.vst3)
      - name: Notice
        run: |
          # derniere notice du dossier docs/ (hors guide MIDI), publiee sous un nom fixe
          N=$(ls docs/*.pdf 2>/dev/null | grep -vi midi | sort -V | tail -1 || true)
          if [ -n "$N" ]; then cp "$N" Omi-Notice.pdf; echo "notice : $N"; else echo "pas de notice"; fi
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.v.outputs.version }}"
          FILES="Omi-VST3-Windows.zip"
          [ -f Omi-Notice.pdf ] && FILES="$FILES Omi-Notice.pdf"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $FILES --clobber
          else
            gh release create "$TAG" $FILES --target "$GITHUB_SHA" --latest \
              --title "Omi $TAG" \
              --notes "Windows : copier Omi.vst3 dans C:\\Program Files\\Common Files\\VST3\\. macOS : copier Omi.vst3 dans ~/Library/Audio/Plug-Ins/VST3/."
          fi

  release-mac:
    if: github.ref == 'refs/heads/main'
    needs: [release, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Version
        id: v
        run: echo "version=$(sed -n 's/^project([A-Za-z0-9_]* VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Archives
        run: |
          (cd dist/Omi-VST3-Windows && zip -r -q "$GITHUB_WORKSPACE/Omi-VST3-Windows.zip" Omi.vst3)
          cp dist/Omi-VST3-macOS/Omi-VST3-macOS.zip .
      - name: Notice
        run: |
          # derniere notice du dossier docs/ (hors guide MIDI), publiee sous un nom fixe
          N=$(ls docs/*.pdf 2>/dev/null | grep -vi midi | sort -V | tail -1 || true)
          if [ -n "$N" ]; then cp "$N" Omi-Notice.pdf; echo "notice : $N"; else echo "pas de notice"; fi
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.v.outputs.version }}"
          FILES="Omi-VST3-Windows.zip Omi-VST3-macOS.zip"
          [ -f Omi-Notice.pdf ] && FILES="$FILES Omi-Notice.pdf"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $FILES --clobber
          else
            gh release create "$TAG" $FILES --target "$GITHUB_SHA" --latest \
              --title "Omi $TAG" \
              --notes "Windows : copier Omi.vst3 dans C:\\Program Files\\Common Files\\VST3\\. macOS : copier Omi.vst3 dans ~/Library/Audio/Plug-Ins/VST3/."
          fi
